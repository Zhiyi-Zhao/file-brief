# =============================================================================
# Workflow introduction
# Inputs: tags matching v* (e.g. v2.0.1) pushed to any branch.
# Outputs: a new file-brief release published to the npm registry.
# Purpose: release the skill bundle to npm so the DSH 1024 Store can offer
#          one-click installs. Tests run before publishing; the published
#          tarball is exactly what `npm pack --dry-run` verified locally.
# Design: local `npm version patch|minor|major` bumps package.json and creates
#         the tag; CI then runs the integration suite and publishes with the
#         NPM_TOKEN repository secret (granular access token with bypass 2FA).
# Jobs: test-and-publish.
# Invocation: automatic on v* tags; manual through workflow_dispatch (tests
#             only, never publishes from a non-tag ref).
# =============================================================================

name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run integration tests
        run: python -m pytest -q -k "not r_data"

      - name: Set up Node.js and npm auth
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
